<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown</title>
  <meta name="description" content="Countdown with an evenly-spread rotating photo wall, full-screen slideshow, and a one-time intro." />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23000'/%3E%3Ctext x='50' y='62' font-size='56' text-anchor='middle' fill='%23fff'%3E%F0%9F%95%9B%EF%B8%8F%3C/text%3E%3C/svg%3E"
  />

  <style>
    :root{
      --text:#f4f7ff;
      --muted:#b8c0d6;
      --glass:rgba(10,12,18,.36);
      --ring:rgba(255,255,255,.28);
      --shadow:0 20px 60px rgba(0,0,0,.55);
      --radius:18px;

      /* Photo wall tuning (desktop defaults) */
      --tile-gap:6px;
      --tile-target:150px;   /* desired tile size */
      --tile-radius:10px;
      --coverage:0.92;       /* fraction of grid filled (1.0 = all free cells) */
      --guard-cells:0;       /* safety ring around timer */
    }
	/* Confetti canvas overlay */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10002; /* above slideshow + welcome-msg */
    }

    @media (max-width: 640px){
      :root{
        --tile-gap:4px;
        --tile-target:92px;
        --coverage:0.92;
        --guard-cells:0;
      }
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      color:var(--text);
      background:#0b0c10;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* ===== Full-screen slideshow (visible only in fullscreen) ===== */
    .bg,.bg2{
      position:fixed;
      inset:0;
      z-index:0;
      background-position:center;
      background-repeat:no-repeat;
      background-size:contain;          /* FIT (no cropping) */
      background-color:#000;
      filter:brightness(.88) saturate(1.02);
      transition:opacity 2s ease;
      display:none;
    }
    .bg{opacity:1}
    .bg2{opacity:0}
    .fs-active .bg,
    .fs-active .bg2{display:block}

    /* ===== Photo Wall (hidden in fullscreen) ===== */
    .wall{
      position:fixed;
      inset:0;
      z-index:0;
      display:grid;
      gap:var(--tile-gap);
      padding:var(--tile-gap);
      background:#0b0c10;
    }
    .fs-active .wall{display:none}

    .tile{
      background:#000;
      border-radius:var(--tile-radius);
      overflow:hidden;
      position:relative;
      contain:paint;
    }

    /* When rotation paused by Spacebar, show badge on body */
    body.paused-badge::after{
      content:"Paused";
      position:fixed;
      right:10px;
      bottom:10px;
      z-index:999;
      background:rgba(0,0,0,.6);
      color:#fff;
      font-weight:700;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
    }

    /* base styles for tile images */
    .tile img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;               /* keep “fit” in the wall */
      transition:
        transform .25s ease,
        opacity .35s ease,
        filter .25s ease;
      opacity:.96;
      filter:saturate(1.05) contrast(1.02) brightness(.98);
      will-change:opacity,transform;
    }

    /* lock hover zoom to none so faces don't get cropped */
    .tile img { transform:none; }
    .tile:hover img { transform:none; }

    .vignette{
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:radial-gradient(
        80% 60% at 50% 40%,
        rgba(0,0,0,.0) 0%,
        rgba(0,0,0,.55) 100%
      );
    }

    /* ===== Foreground (header + timer) ===== */
    .wrap{
      position:relative;
      z-index:2;
      height:100%;
      width:100%;
      display:grid;
      grid-template-rows:auto 1fr auto;
      place-items:center;
      padding:20px;
      text-align:center;
      transition:transform .25s ease-out;
      pointer-events:none; /* let clicks pass through except where we re-enable below */
    }
    header,
    .controls,
    .btn,
    #timerCard { pointer-events:auto; }

    header{
      width:100%;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
    }
    h1{
      grid-column:2;
      margin:0;
      font-weight:800;
      letter-spacing:.4px;
      font-size:clamp(1.4rem,1rem + 2.6vw,3rem);
      text-shadow:0 2px 16px rgba(0,0,0,.55);
      justify-self:center;
      pointer-events:none;
      color:#fff;
    }
    .controls{
      grid-column:3;
      justify-self:end;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.2);
      cursor:pointer;
      background:rgba(255,255,255,.12);
      color:var(--text);
      border-radius:999px;
      padding:8px 12px;
      font-weight:700;
      backdrop-filter:blur(6px);
    }

    .timer-card{
      background:var(--glass);
      -webkit-backdrop-filter:blur(10px);
      backdrop-filter:blur(10px);
      border:1px solid var(--ring);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:clamp(14px,2vw,22px);
      max-width:min(920px,92vw);
      width:100%;
      transition:all .25s ease;
    }
    .label{
      color:var(--muted);
      font-size:.95rem;
      margin-bottom:8px;
    }
    .timer{
      display:grid;
      grid-template-columns:repeat(4, minmax(90px, 1fr));
      gap:clamp(8px,2vw,16px)
    }
    @media (max-width:560px){
      .timer{grid-template-columns:repeat(2, minmax(120px, 1fr))}
    }
    .tbox{
      background:rgba(8,10,16,.55);
      border:1px solid rgba(255,255,255,.18);
      border-radius:14px;
      padding:clamp(12px,2.2vw,18px);
      text-align:center
    }
    .num{
      font-variant-numeric:tabular-nums;
      font-weight:900;
      font-size:clamp(2rem,5.5vw,3.2rem);
      line-height:1.1;
      letter-spacing:.6px;
      color:#fff;
      text-shadow:0 2px 16px rgba(0,0,0,.8);
    }
    .lab{
      margin-top:6px;
      color:var(--muted);
      font-size:.95rem
    }
    footer{height:1px}

    /* Fullscreen: move timer down */
    .fs-active header{display:none}
    .fs-active .timer-card{
      position:fixed;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      max-width:min(760px,94vw);
      background:rgba(10,12,18,.28);
      border-color:rgba(255,255,255,.22)
    }

    /* ===== Intro overlay ===== */
    .intro{
      position:fixed;
      inset:0;
      z-index:9999;
      display:grid;
      place-items:center;
      background:
        radial-gradient(1200px 800px at 80% -10%, #1a1f2c 0%, #0b0c10 60%),
        #0b0c10;
      overflow:hidden;
      color:#eaf0ff;
      opacity:1;
      transition:opacity .6s ease, visibility .6s ease;
      visibility:visible;
    }
    .intro.hide{
      opacity:0;
      visibility:hidden;
    }

    .intro-head{
      position:relative;
      text-align:center;
      z-index:2;
      transform:translateY(10px);
      opacity:0;
      animation:introIn .8s .2s ease forwards;
    }
    .intro-title{
      font-weight:900;
      letter-spacing:.6px;
      font-size:clamp(1.8rem, 2.2vw + 1.3rem, 3.2rem);
      text-shadow:0 6px 40px rgba(0,0,0,.7);
    }
    .intro-sub{
      margin-top:8px;
      color:var(--muted);
      font-size:clamp(.95rem, .4vw + .85rem, 1.1rem);
    }

    @keyframes introIn{
      from{ transform:translateY(16px); opacity:0; filter:blur(6px); }
      to{ transform:translateY(0); opacity:1; filter:blur(0); }
    }

    .intro-tiles{
      position:absolute;
      inset:-10% -10% -10% -10%;
      z-index:1;
      pointer-events:none;
      filter:blur(.2px);
    }
    .intro-tile{
      position:absolute;
      width:16vmin;
      height:10vmin;
      border-radius:12px;
      background:linear-gradient(180deg, #1b2030, #121620);
      border:1px solid rgba(255,255,255,.06);
      box-shadow:0 10px 40px rgba(0,0,0,.35);
      opacity:0;
      transform:translateY(12vh) scale(.98) rotate(var(--rot, 0deg));
      animation: rise var(--dur, 1800ms) var(--delay, 0ms) cubic-bezier(.22,.61,.36,1) forwards;
    }
    .intro-tile::after{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(100% 100% at 50% 0%, rgba(255,255,255,.08), rgba(0,0,0,0));
    }
    @keyframes rise{
      0%{
        opacity:0;
        transform:translateY(12vh) scale(.98) rotate(var(--rot, 0deg));
      }
      60%{ opacity:.9; }
      100%{
        opacity:0;
        transform:translateY(-18vh) scale(1) rotate(calc(var(--rot, 0deg) + 6deg));
      }
    }

    .intro-skip{
      position:fixed;
      right:14px;
      bottom:14px;
      z-index:3;
      background:rgba(255,255,255,.12);
      color:#eaf0ff;
      border:1px solid rgba(255,255,255,.22);
      border-radius:999px;
      padding:8px 12px;
      font-weight:700;
      cursor:pointer;
      backdrop-filter:blur(6px);
      transition:transform .08s ease, opacity .2s ease;
    }
    .intro-skip:active{ transform:translateY(1px); }

    @media (prefers-reduced-motion: reduce){
      .intro-tiles{display:none;}
      .intro-head{
        animation:none;
        opacity:1;
        transform:none;
      }
    }

    /* ===== Lightbox overlay when clicking a photo ===== */
    .photo-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.9);
      display: grid;
      place-items: center;
      animation: fadeIn .35s ease;
    }
    .photo-overlay img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 14px;
      box-shadow: 0 30px 120px rgba(0,0,0,.6);
    }
    .photo-overlay .caption {
      margin-top: 14px;
      color: #eaf0ff;
      font-size: clamp(1rem, .6vw + .9rem, 1.3rem);
      text-align: center;
      opacity: .9;
    }

    @keyframes fadeIn {
      from {opacity: 0}
      to   {opacity: 1}
    }

    /* ===== Celebration overlay at countdown = 0 ===== */
    /* Fullscreen cover that blurs/darkens everything behind */
    .welcome-msg {
      position: fixed;
      inset: 0;
      z-index: 10000;

      background: rgba(0,0,0,.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;

      animation: fadeIn .4s ease;
    }

    /* Center card */
    .welcome-card {
      position: relative;
      min-width: min(90vw, 800px);

      border-radius: 20px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.08) 0%, rgba(0,0,0,0) 70%),
        rgba(15,18,28,.6);
      border: 1px solid rgba(255,255,255,.22);

      box-shadow:
        0 30px 120px rgba(0,0,0,.9),
        0 0 60px rgba(255,255,255,.28);

      padding: 24px 20px 28px;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* soft animated glow halo behind the card */
    .welcome-card::before {
      content:"";
      position:absolute;
      left:50%;
      top:0;
      width:260px;
      height:260px;
      translate:-50% -40%;
      background:radial-gradient(circle,
        rgba(255,255,255,.45) 0%,
        rgba(255,255,255,0) 70%);
      filter:blur(40px);
      opacity:.5;
      animation:pulseGlow 3s ease-in-out infinite;
      pointer-events:none;
    }

    .welcome-card h2 {
      margin: 0 0 10px;
      font-weight: 900;
      font-size: clamp(1.6rem, 2.4vw + 1rem, 3.2rem);
      letter-spacing:.03em;
      color:#fff;
      text-shadow:0 4px 24px rgba(0,0,0,.9);
    }
    .welcome-card p {
      margin: 0;
      color: #cbd5e1;
      font-size: clamp(1rem, .8vw + .9rem, 1.4rem);
    }

    @keyframes pulseGlow {
      0%   {opacity:.35; filter:blur(40px) brightness(1);}
      50%  {opacity:.75; filter:blur(32px) brightness(1.4);}
      100% {opacity:.35; filter:blur(40px) brightness(1);}
    }
	/* Confetti canvas (used at celebration time) */
	#confettiCanvas {
	  position: fixed;
	  inset: 0;
	  width: 100vw;
	  height: 100vh;
	  pointer-events: none;
	  z-index: 10002; /* sits above everything, party mode */
	}
  </style>
</head>

    <main class="timer-card" id="timerCard" aria-live="polite" aria-label="Countdown">
      <div class="label">Countdown to November 1, 2025 — 19:40</div>

        <div class="tbox"><div class="num" id="days">00</div><div class="lab">Days</div></div>

        <div class="tbox"><div class="num" id="mins">00</div><div class="lab">Minutes</div></div>
        <div class="tbox"><div class="num" id="secs">00</div><div class="lab">Seconds</div></div>
      </div>
    </main>

    <footer></footer>
  </div>

    /************************************************************
     * COUNTDOWN / CELEBRATION
     ************************************************************/

    const pad = n => String(n).padStart(2,"0");
    let cdInterval=null;

    // Inline confetti (no external CDN)
    let _confettiAnimating = false;
    let _confettiStopRequested = false;
    
    function launchConfettiRain() {
      // create or reuse the canvas
      let canvas = document.getElementById("confettiCanvas");
      if (!canvas) {
        canvas = document.createElement("canvas");
        canvas.id = "confettiCanvas";
        document.body.appendChild(canvas);
      }
    
      const ctx = canvas.getContext("2d");
      let W, H;
    
      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);
    
      const COLORS = ["#ff4d4d", "#ffd633", "#4dff4d", "#4dd2ff", "#b84dff", "#ffffff"];
    
      const gravity = 0.12;
      const drag = 0.985;
      const terminalVel = 5;
    
      // each particle is a tiny paper rectangle
      const particles = [];
    
      // helper: spawn N confetti in a burst, with direction "spreadDeg" and "power"
      function spawnBurst(count, spreadDeg, power, originX, originY, upwardBias = -3) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.random() * spreadDeg - spreadDeg / 2) * (Math.PI / 180);
          const speed = power * (0.5 + Math.random() * 0.5);
    
          particles.push({
            x: originX,
            y: originY,
            w: 6 + Math.random() * 4,
            h: 10 + Math.random() * 6,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed + upwardBias,
            rot: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 0.2,
            opacity: 1
          });
        }
      }
    
      // helper: side drizzle spawners
      let drizzleSide = 0;
      let drizzleTimer = null;
      function startDrizzle() {
        if (drizzleTimer) return;
        drizzleTimer = setInterval(() => {
          const fromLeft = drizzleSide === 0;
          drizzleSide = 1 - drizzleSide;
          const x = fromLeft ? W * 0.2 : W * 0.8;
          const y = H * 0.05;
          spawnBurst(12, 70, 8, x, y, 0); // mostly downward-ish
        }, 400);
      }
    
      function stopDrizzle() {
        if (drizzleTimer) {
          clearInterval(drizzleTimer);
          drizzleTimer = null;
        }
      }
    
      // initial BOOM from center/top-third:
      spawnBurst(200, 80, 10, W * 0.5, H * 0.33, -3);
    
      // start drizzle
      startDrizzle();
    
      // if we're already animating, don't start another RAF loop
      if (_confettiAnimating) return;
      _confettiAnimating = true;
      _confettiStopRequested = false;
    
      function step() {
        ctx.clearRect(0, 0, W, H);
    
        particles.forEach(p => {
          // physics:
          p.vy += gravity;
          if (p.vy > terminalVel) p.vy = terminalVel;
          p.vx *= drag;
          p.vy *= drag;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
    
          // fade out near bottom
          if (p.y > H * 0.7) {
            p.opacity -= 0.01;
          }
    
          // draw particle
          ctx.globalAlpha = Math.max(p.opacity, 0);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
    
        // remove dead ones
        for (let i = particles.length - 1; i >= 0; i--) {
          if (particles[i].opacity <= 0 || particles[i].y > H + 100) {
            particles.splice(i, 1);
          }
        }
    
        // if user closed the overlay, we stop spawning drizzle
        // and when everything has faded out we end the loop
        if (_confettiStopRequested) {
          stopDrizzle();
          if (particles.length === 0) {
            _confettiAnimating = false;
            // optional clean up canvas:
            // canvas.remove();
            return;
          }
        }
    
        requestAnimationFrame(step);
      }
    
      requestAnimationFrame(step);
    
      // expose a stopper so we can end the rain when overlay closes
      window._stopConfettiRainInternal = () => {
        _confettiStopRequested = true;
      };
    }
    
    function stopConfettiRain() {
      // tell the loop to wind down
      if (window._stopConfettiRainInternal) {
        window._stopConfettiRainInternal();
      }
    }
    

    // Build + show the celebration overlay
    function showWelcomeMessage(name = "Welcome home, master of masters! 🎓") {
      const overlay = document.createElement('div');
      overlay.className = 'welcome-msg';

      overlay.innerHTML = `
        <div class="welcome-card">
          <h2>${name}</h2>
          <p>We’re so proud of you.</p>
        </div>
      `;

      document.body.appendChild(overlay);

      // Close on click anywhere or ESC
      const close = () => {
        overlay.remove();
        stopConfettiRain();
      };

      overlay.addEventListener('click', close, { once: true });

      document.addEventListener('keydown', function esc(ev){
        if (ev.key === 'Escape') {
          close();
          document.removeEventListener('keydown', esc);
        }
      });
    }

    function startCountdown(targetDate){
      if(cdInterval) clearInterval(cdInterval);

      function tick(){
        const now=new Date();
        let diff=Math.max(0,targetDate-now);

        const d=Math.floor(diff/86400000); diff-=d*86400000;
        const h=Math.floor(diff/3600000);  diff-=h*3600000;
        const m=Math.floor(diff/60000);    diff-=m*60000;
        const s=Math.floor(diff/1000);

        const days=document.getElementById("days"),
              hours=document.getElementById("hours"),
              mins=document.getElementById("mins"),
              secs=document.getElementById("secs");

        days.textContent=pad(d);
        hours.textContent=pad(h);
        mins.textContent=pad(m);
        secs.textContent=pad(s);

        // celebration trigger at T=0 (runs once)
        if (!window._celebrated && diff <= 0) {
          window._celebrated = true;
          try { clearInterval(cdInterval); } catch {}

          // Go fullscreen slideshow, confetti rain, fancy overlay
          goFullscreenSlideshow().then(() => {
            launchConfettiRain();
            showWelcomeMessage("Welcome home, master of masters! 🎓");
          });
        }
      }

      tick();
      cdInterval=setInterval(tick,1000);
    }
    startCountdown(DEFAULT_TARGET);

    /************************************************************
     * ELEMENT HANDLES
     ************************************************************/
    const wall=document.getElementById("wall");
    const timerCard=document.getElementById("timerCard");
    const shuffleBtn=document.getElementById("shuffleBtn");
    const fsBtn=document.getElementById("fsBtn");
    const bg1=document.getElementById("bg1");
    const bg2=document.getElementById("bg2");

    /************************************************************
     * PARALLAX FOREGROUND
     ************************************************************/
    (() => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const root = document.querySelector('.wrap');
      let raf = 0, targetX = 0, targetY = 0, currX = 0, currY = 0;

      function onMove(e){
        const x = (e.clientX / innerWidth  - 0.5) * 8;
        const y = (e.clientY / innerHeight - 0.5) * 8;
        targetX = x; targetY = y;
        if (!raf) raf = requestAnimationFrame(tick);
      }
      function tick(){
        currX += (targetX - currX) * 0.12;
        currY += (targetY - currY) * 0.12;
        root.style.transform = `translate(${currX}px, ${currY}px)`;
        if (Math.abs(targetX - currX) > 0.1 || Math.abs(targetY - currY) > 0.1) {
          raf = requestAnimationFrame(tick);
        } else {
          raf = 0;
        }
      }
      window.addEventListener('mousemove', onMove, { passive: true });
    })();

    /************************************************************
     * LIGHTBOX ON CLICKED PHOTO
     ************************************************************/
    (() => {
      wall.addEventListener('click', (e) => {
        const img = e.target.closest('.tile img');
        if (!img) return;

        overlay.className = 'photo-overlay';

          </div>
        `;
        document.body.appendChild(overlay);

        const esc = (ev) => { if (ev.key === 'Escape') close(); };
        document.addEventListener('keydown', esc);

        function close(){
          overlay.remove();
          document.removeEventListener('keydown', esc);
        }

        overlay.addEventListener('click', close, { once: true });
      });
    })();

    /************************************************************
     * SPACEBAR PAUSE/RESUME ROTATION
     ************************************************************/
    (() => {
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
          const ae = document.activeElement;
          const isInteractive =
            (ae && /^(INPUT|TEXTAREA|BUTTON|SELECT)$/.test(ae.tagName)) ||
            ae?.isContentEditable;

          } else {

    /************************************************************
     * INTRO OVERLAY LOGIC
     ************************************************************/
    const intro = document.getElementById('intro');
    const introTiles = document.getElementById('introTiles');
    const introSkip = document.getElementById('introSkip');
    const INTRO_KEY = 'intro_seen_v1';
    const INTRO_LEN = 2400; // ms until auto-hide

    function spawnIntroTiles(){
      // Create 24 floating shards with staggered timings
      const N = 24;
      const W = innerWidth, H = innerHeight;
      for(let i=0;i<N;i++){
        const d = document.createElement('div');

        d.style.setProperty('--delay', (Math.random()*400) + 'ms');
        d.style.setProperty('--dur', (1600 + Math.random()*900) + 'ms');
        d.style.setProperty('--rot', (Math.random()*16 - 8) + 'deg');
        introTiles.appendChild(d);
      }
    }
    function hideIntro(){
      intro.classList.add('hide');
      setTimeout(()=>{ intro.remove(); }, 650);
    }
    function maybePlayIntro(){
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const seen = localStorage.getItem(INTRO_KEY) === '1';
      if(seen || reduced){
        hideIntro();
        return;
      }

      spawnIntroTiles();
      const t = setTimeout(()=>{ hideIntro(); }, INTRO_LEN);
      introSkip.addEventListener('click', ()=>{
        clearTimeout(t);
        hideIntro();
      }, { once:true });

      localStorage.setItem(INTRO_KEY,'1');
    }
    window.addEventListener('load', maybePlayIntro);

    // Preload images into browser cache to make rotation swaps faster
    IMAGES.forEach(i=>{
      const im=new Image();
      im.src=i.src;
    });

    /************************************************************
     * BLUE-NOISE-ish SPREAD
     ************************************************************/
    function pickEvenlySpacedCells(freeCells, desired, cols, rows){
      if(!freeCells.length||desired<=0) return [];
      const cx=(cols-1)/2, cy=(rows-1)/2;
      let seed=freeCells[0], best=-1;
      for(const c of freeCells){
        const dx=c.col-cx, dy=c.row-cy, s=dx*dx+dy*dy;
        if(s>best){best=s; seed=c;}
      }
      const selected=[seed];
      while(selected.length<desired && selected.length<freeCells.length){
        let bestCell=null, bestDist=-1;
        for(const c of freeCells){
          if(selected.some(s=>s.col===c.col && s.row===c.row)) continue;
          let minD2=Infinity;
          for(const s of selected){
            const dx=c.col-s.col, dy=c.row-s.row, d2=dx*dx+dy*dy;
            if(d2<minD2) minD2=d2;
          }
          if(minD2>bestDist){ bestDist=minD2; bestCell=c; }
        }
        if(!bestCell) break;
        selected.push(bestCell);
      }
      return selected;
    }
    function shuffleInPlace(a){
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    }

    /************************************************************
     * PHOTO WALL + ROTATION
     ************************************************************/
    let tiles = [];                    // [{ el, imgEl, imgIndex, busy }]
    let visibleSet = new Set();        // which image indexes are visible now
    let pool = [];                     // which image indexes are waiting to rotate in
    let rotateTimer = null;
    const lastSwapAt = new Map();      // tileEl -> timestamp last swapped

    function computeFreeCells(cols, rows, gap, cellW, cellH, guard){
      const r=timerCard.getBoundingClientRect();
      const startCol=Math.max(0,Math.floor((r.left-gap)/(cellW+gap))-guard);
      const endCol=Math.min(cols-1,Math.floor((r.right-gap)/(cellW+gap))+guard);
      const startRow=Math.max(0,Math.floor((r.top-gap)/(cellH+gap))-guard);
      const endRow=Math.min(rows-1,Math.floor((r.bottom-gap)/(cellH+gap))+guard);

      const free=[];
      for(let row=0; row<rows; row++){
        for(let col=0; col<cols; col++){
          const inside=(col>=startCol && col<=endCol && row>=startRow && row<=endRow);
          if(!inside) free.push({row,col});
        }
      }
      return free;
    }

    function stopWallRotation(){
      if(rotateTimer){
        clearInterval(rotateTimer);
        rotateTimer=null;
      }
    }

    function startWallRotation(){
      stopWallRotation();
      if(pool.length === 0) return; // nothing to rotate in
      rotateTimer = setInterval(rotateSomeTiles, ROTATE_MS);
    }

    // staggered, preloaded crossfade for a batch of tiles
    function rotateSomeTiles(){
      if(pool.length === 0 || tiles.length === 0) return;

      const now = performance.now();
      const candidates = tiles
        .map((t, i) => ({ t, i }))
        .filter(({ t }) => {
          if (t.busy) return false;
          if (PAUSE_ON_HOVER && t.el.matches(':hover')) return false;
          const last = lastSwapAt.get(t.el) || 0;
          return (now - last) > ROTATE_MS * 1.2;
        });

      if (candidates.length === 0) return;

      const swaps = Math.min(rotateBatchSize(), candidates.length, pool.length);
      if (swaps <= 0) return;

      shuffleInPlace(candidates);
      const chosen = candidates.slice(0, swaps).map(c => c.t);

      // break chosen into groups for staggered ripple
      const groups = [];
      for (let i = 0; i < chosen.length; i += GROUP_SIZE) {
        groups.push(chosen.slice(i, i + GROUP_SIZE));
      }

      function swapTile(t){
        if (pool.length === 0) return;

        // pick a non-visible index if we can
        let nextIdx = pool.shift();
        if (nextIdx == null) return;
        if (visibleSet.has(nextIdx)) {
          let found = -1;
          for (let j = 0; j < pool.length; j++) {
            if (!visibleSet.has(pool[j])) { found = j; break; }
          }
          if (found >= 0) {
            pool.push(nextIdx);
            nextIdx = pool.splice(found, 1)[0];
          }
        }

        t.busy = true;

        // old image goes back into pool
        if (Number.isInteger(t.imgIndex)) {
          visibleSet.delete(t.imgIndex);
          pool.push(t.imgIndex);
        }

        // preload → fade
        const meta = IMAGES[nextIdx];
        const pre = new Image();
        pre.decoding = "async";
        pre.src = meta.src;

        pre.onload = () => {
          const el = t.imgEl;
          el.style.transition = `opacity ${FADE_MS}ms ease`;
          el.style.opacity = 0;

          requestAnimationFrame(() => {
            el.src = pre.src;
            el.alt = meta.caption || "Photo";
            el.style.opacity = .96;

            setTimeout(() => {
              t.busy = false;
            }, FADE_MS + 20);
          });
        };

        pre.onerror = () => {
          // if load failed, just put candidate back and free tile
          pool.push(nextIdx);
          t.busy = false;
        };

        t.imgIndex = nextIdx;
        visibleSet.add(nextIdx);
        lastSwapAt.set(t.el, performance.now());
      }

      groups.forEach((group, idx) => {
        setTimeout(() => {
          group.forEach(t => swapTile(t));
        }, idx * STAGGER_MS);
      });
    }

    function buildWall(){
      const W=innerWidth,
            H=innerHeight,
            cs=getComputedStyle(document.documentElement);

      const gap=parseFloat(cs.getPropertyValue("--tile-gap"))||6;
      const target=parseFloat(cs.getPropertyValue("--tile-target"))||150;
      const coverageBase=Math.max(0,Math.min(1,parseFloat(cs.getPropertyValue("--coverage"))||0.6));
      const guardBase=parseInt(cs.getPropertyValue("--guard-cells"))||0;

      const cols=Math.max(2,Math.floor((W-gap)/(target+gap)));
      const rows=Math.max(2,Math.floor((H-gap)/(target+gap)));
      const cellW=(W-gap*(cols+1))/cols,
            cellH=(H-gap*(rows+1))/rows;

      wall.style.gridTemplateColumns=`repeat(${cols},1fr)`;

      // figure out which grid cells are not covered by the timer card
      let guard=guardBase;
      let free=computeFreeCells(cols,rows,gap,cellW,cellH,guard);

      // fallback if timer takes almost entire screen (mobile / landscape weirdness)
      if(free.length===0){
        guard=0;
        free=computeFreeCells(cols,rows,gap,cellW,cellH,guard);
        if(free.length===0){
          for(let r=0;r<rows;r++){
            for(let c=0;c<cols;c++){
              free.push({row:r,col:c});
            }
          }
        }
      }

      const total=rows*cols;
      const relaxed = (guard!==guardBase);
      const coverage = relaxed ? Math.min(coverageBase, 0.40) : coverageBase;

      // how many cells we want to actually fill
      const desired = Math.min(
        free.length,
        Math.max(1, Math.round(total * coverage))
      );

      // distribute cells nicely
      const cells = (desired >= free.length - 1)
        ? free
        : pickEvenlySpacedCells(free, desired, cols, rows);

      const allIdx = [...IMAGES.keys()];
      shuffleInPlace(allIdx);

      visibleSet.clear();
      tiles = [];
      wall.innerHTML="";
      lastSwapAt.clear();

      const initial = allIdx.slice(0, Math.min(desired, allIdx.length));
      pool = allIdx.slice(initial.length);

      // make sure we actually *have* a rotation pool
      const MIN_POOL = 6;
      if (pool.length < MIN_POOL && initial.length > MIN_POOL) {
        const needed = MIN_POOL - pool.length;
        const giveBack = initial.splice(initial.length - needed, needed);
        pool.push(...giveBack);
      }

      // if we still need more to fill the wall, wrap around
      while(initial.length < desired){
        initial.push(...allIdx);
      }

      // create actual DOM tiles
      for(let i=0;i<cells.length;i++){
        const {row,col}=cells[i];
        const idx = initial[i % initial.length];

        const t=document.createElement("div");
        t.className="tile";
        t.style.gridColumn=(col+1);
        t.style.gridRow=(row+1);

        const img=document.createElement("img");
        img.src=IMAGES[idx].src;
        img.alt=IMAGES[idx].caption||`Photo ${i+1}`;
        img.loading="eager";
        img.decoding="async";

        t.appendChild(img);
        wall.appendChild(t);

        tiles.push({
          el: t,
          imgEl: img,
          imgIndex: idx,
          busy: false
        });

        visibleSet.add(idx);
      }

      // clean pool so it only holds not-currently-visible images
      pool = pool.filter(id => !visibleSet.has(id));

      startWallRotation();
    }

    // Rebuild wall on load, resize, shuffle, and also after timerCard layout settles
    let resizeT;
    function rebuildWallSoon(){
      clearTimeout(resizeT);
      resizeT=setTimeout(buildWall,120);
    }

    addEventListener("load", buildWall);
    addEventListener("resize", ()=>{
      stopWallRotation();
      rebuildWallSoon();
    });
    shuffleBtn.addEventListener("click", ()=>{
      stopWallRotation();
      buildWall();
    });

    const ro = new ResizeObserver(() => rebuildWallSoon());
    ro.observe(timerCard);

    /************************************************************
     * FULLSCREEN SLIDESHOW
     ************************************************************/
    let slideIdx=0,
        onFirst=true,
        autoTimer=null;
    const AUTO_MS=3000;
    let fsOrder = [];   // shuffled indexes

    function setBG(div, i){
      if (!fsOrder.length) return;
      const id = fsOrder[(i + fsOrder.length) % fsOrder.length];
      const it = IMAGES[id];
      div.style.backgroundImage=`url('${it.src}')`;
      div.setAttribute("aria-label", it.caption||"Background photo");
    }

    function showNext(){
      const next=(slideIdx+1)%fsOrder.length;
      if(onFirst){
        setBG(bg2,next);
        bg2.style.opacity=1;
        bg1.style.opacity=0;
      } else {
        setBG(bg1,next);
        bg1.style.opacity=1;
        bg2.style.opacity=0;
      }
      onFirst=!onFirst;
      slideIdx=next;
    }

    function startSlideshow(){
      if(!IMAGES.length) return;
      fsOrder = IMAGES.map((_, i) => i);
      shuffleInPlace(fsOrder); // shuffle image order
      slideIdx = 0;
      onFirst = true;
      setBG(bg1,0);

      if(autoTimer) clearInterval(autoTimer);
      autoTimer=setInterval(showNext,AUTO_MS);
    }

    function restartAuto(){
      if(autoTimer){
        clearInterval(autoTimer);
        autoTimer=setInterval(showNext,AUTO_MS);
      }
    }

    addEventListener("keydown", e=>{
      if(!document.fullscreenElement) return;

      if(e.key==="ArrowRight"){
        showNext();
        restartAuto();
      }
      if(e.key==="ArrowLeft"){
        const prev=(slideIdx-1+fsOrder.length)%fsOrder.length;
        if(onFirst){
          setBG(bg2,prev);
          bg2.style.opacity=1;
          bg1.style.opacity=0;
        } else {
          setBG(bg1,prev);
          bg1.style.opacity=1;
          bg2.style.opacity=0;
        }
        onFirst=!onFirst;
        slideIdx=prev;
        restartAuto();
      }
    });

    // Try to request fullscreen and start slideshow
    async function goFullscreenSlideshow(){
      try {
        await document.documentElement.requestFullscreen?.();
      } catch(e) {
        // fullscreen might be denied (e.g. user gesture requirements)
        // that's okay, we still continue celebration.
      }
      stopWallRotation();      // pause wall while we're "celebrating"
      startSlideshow();        // start fullscreen slideshow (or just prep it)
    }

    // manual fullscreen toggle button
    fsBtn.addEventListener("click", ()=>{
      if(!document.fullscreenElement){
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });

    // whenever fullscreen state flips
    document.addEventListener("fullscreenchange", () => {
      const fs = !!document.fullscreenElement;
      document.body.classList.toggle("fs-active", fs);

      if (fs) {
        // entering fullscreen
        stopWallRotation();
        startSlideshow();
      } else {
        // leaving fullscreen
        if (autoTimer) clearInterval(autoTimer);

        // after timer-card's CSS transition (~250ms), rebuild wall layout
        const afterTransition = () => {
          timerCard.removeEventListener("transitionend", afterTransition);
          requestAnimationFrame(() => buildWall());
        };

        timerCard.addEventListener("transitionend", afterTransition, { once: true });

        setTimeout(() => {
          try { timerCard.removeEventListener("transitionend", afterTransition); } catch {}
          requestAnimationFrame(() => buildWall());
        }, 320); // just over .25s
      }
    });

    /************************************************************
     * (OPTIONAL DEV QUICKTEST - DO NOT COMMIT TO MAIN)
     ************************************************************/

    // });

  </script>
